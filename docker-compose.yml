services:
  # 1. Base de données
  db:
    image: postgres:17-alpine
    container_name: gamerChallenges_db
    restart: always
    environment:
      POSTGRES_USER: gamer
      POSTGRES_PASSWORD: gamer
      POSTGRES_DB: gamer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend (API)
  api:
    build: ./api
    container_name: gamerChallenges_api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://gamer:gamer@db:5432/gamer
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db

  # 3. Frontend (Client)
  client:
    # Le Dockerfile est dans client/myapp selon ton arborescence
    build: ./client/myapp
    container_name: gamerChallenges_client
    ports:
      - "5173:5173"
    volumes:
      - ./client/myapp:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - api
    # Commande pour lancer le serveur de dev Vite/Svelte en mode exposé
    command: npm run dev -- --host

  # 5. Frontend + reverse proxy Nginx - mode production
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: gamerChallenges_nginx
    profiles:
      - prod
    depends_on:
      - api-prod
    ports:
      - "80:80"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data: