name: Deploy on release tag (self-hosted)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    name: Deploy to production server (self-hosted)
    runs-on: self-hosted

    steps:
      - name: Deploy latest main via docker compose
        run: |
          cd /home/student/projet-gamer-challenges
          git fetch origin
          git checkout main
          git pull origin main
          docker compose down || true
          docker compose --profile prod up -d --build
