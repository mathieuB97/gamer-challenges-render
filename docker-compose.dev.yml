services:
  # Configuration spécifique au développement

  # Service d'aide au développement avec messages colorés
  dev-helper:
    image: alpine:latest
    container_name: gamerChallenges_dev_helper
    profiles: [ "dev" ]
    command: |
      sh -c "
        echo -e '\\033[0;34mMode développement activé\\033[0m'
        echo -e '\\033[1;33mLogs avec préfixes colorés :\\033[0m'
        echo -e '   \\033[0;34mbackend:\\033[0m pour l API Node.js/Express'  
        echo -e '   \\033[0;32mfrontend:\\033[0m pour le client Svelte'
        echo -e '   \\033[1;33mdatabase:\\033[0m pour PostgreSQL'
        echo -e ''
        echo -e '\\033[1;33mUtilisez Ctrl+C pour arrêter tous les services\\033[0m'
        sleep 2
      "
    depends_on:
      - init-checker

  api:
    container_name: gamerChallenges_api_dev
    profiles: [ "dev" ]
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true # Hot reload pour tous les OS
    command: npm run dev
    labels:
      - "docker-compose.service=backend"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - dev-helper
      - db

  client:
    container_name: gamerChallenges_client_dev
    profiles: [ "dev" ]
    volumes:
      - ./client/myapp:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev -- --host
    labels:
      - "docker-compose.service=frontend"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    container_name: gamerChallenges_db_dev
    profiles: [ "dev" ]
    labels:
      - "docker-compose.service=database"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
