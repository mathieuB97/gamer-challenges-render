services:
  # Configuration spécifique à la production

  # Service d'information production
  prod-helper:
    image: alpine:latest
    container_name: gamerChallenges_prod_helper
    profiles: [ "prod" ]
    command: |
      sh -c "
        echo -e '\\033[0;32mMode production activé\\033[0m'
        echo -e '\\033[1;33mServices optimisés pour la production\\033[0m'
        echo -e '\\033[0;34mLogs avec rotation automatique\\033[0m'
        sleep 2
      "
    depends_on:
      - init-checker

  api:
    container_name: gamerChallenges_api_prod
    profiles: [ "prod" ]
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
    command: npm run start
    restart: unless-stopped
    labels:
      - "docker-compose.service=backend"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - prod-helper
      - db

  client:
    container_name: gamerChallenges_client_prod
    profiles: [ "prod" ]
    build:
      context: ./client/myapp
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    labels:
      - "docker-compose.service=frontend"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  db:
    container_name: gamerChallenges_db_prod
    profiles: [ "prod" ]
    restart: unless-stopped
    labels:
      - "docker-compose.service=database"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
